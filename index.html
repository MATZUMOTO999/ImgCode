<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Image to Code Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1> Image to Code Converter</h1>
        <p class="subtitle">Sube una imagen y conviértela en código puro</p>
        
        <label class="upload-zone" for="fileInput">
            <h2> Haz clic o arrastra una imagen aquí</h2>
            <p>(PNG, JPG, GIF)</p>
            <input type="file" id="fileInput" accept="image/*">
        </label>
        
        <div class="controls">
            <label>
                Resolución:
                <input type="range" id="resolution" min="10" max="100" value="40">
                <span id="resValue">40px</span>
            </label>
            <button onclick="convertir()"> Convertir</button>
            <button onclick="copiarCodigo()">Copiar código</button>
        </div>
        
        <div class="preview">
            <div class="preview-box">
                <h3> Imagen original (pixelada)</h3>
                <canvas id="originalImage"></canvas>
            </div>
            <div class="preview-box">
                <h3> Vista previa del código</h3>
                <canvas id="pixelatedImage"></canvas>
            </div>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="cambiarTab('html')">HTML/CSS</button>
            <button class="tab" onclick="cambiarTab('canvas')">JavaScript Canvas</button>
            <button class="tab" onclick="cambiarTab('ascii')">ASCII Art</button>
        </div>
        
        <pre class="code-output" id="codeOutput">Sube una imagen para ver el código aquí...</pre>
    </div>

    <script>
        let imageData = null;
        let currentTab = 'html';
        let generatedCode = '';
        
        const fileInput = document.getElementById('fileInput');
        const resolution = document.getElementById('resolution');
        const resValue = document.getElementById('resValue');
        
        resolution.addEventListener('input', () => {
            resValue.textContent = resolution.value + 'px';
        });
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => procesarImagen(img);
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
        
        function procesarImagen(img) {
            const size = parseInt(resolution.value);
            const ratio = img.width / img.height;
            const width = size;
            const height = Math.round(size / ratio);
            
            // Canvas original pixelado
            const canvasOrig = document.getElementById('originalImage');
            canvasOrig.width = width;
            canvasOrig.height = height;
            canvasOrig.style.width = '300px';
            const ctxOrig = canvasOrig.getContext('2d');
            ctxOrig.drawImage(img, 0, 0, width, height);
            
            // Canvas de vista previa
            const canvasPrev = document.getElementById('pixelatedImage');
            canvasPrev.width = width;
            canvasPrev.height = height;
            canvasPrev.style.width = '300px';
            const ctxPrev = canvasPrev.getContext('2d');
            ctxPrev.drawImage(img, 0, 0, width, height);
            
            // Extraer datos de píxeles
            imageData = ctxOrig.getImageData(0, 0, width, height);
            convertir();
        }
        
        function convertir() {
            if (!imageData) return;
            
            if (currentTab === 'html') generarHTML();
            else if (currentTab === 'canvas') generarCanvas();
            else if (currentTab === 'ascii') generarASCII();
            
            document.getElementById('codeOutput').textContent = generatedCode;
        }
        
        function generarHTML() {
            const w = imageData.width;
            const h = imageData.height;
            let html = `<!-- Imagen generada con Image-to-Code -->\n<div class="pixel-art" style="display:grid;grid-template-columns:repeat(${w},5px);width:${w*5}px;">\n`;
            
            for (let i = 0; i < imageData.data.length; i += 4) {
                const r = imageData.data[i];
                const g = imageData.data[i+1];
                const b = imageData.data[i+2];
                const a = imageData.data[i+3];
                html += `  <div style="width:5px;height:5px;background:rgba(${r},${g},${b},${(a/255).toFixed(2)})"></div>\n`;
            }
            html += `</div>`;
            generatedCode = html;
        }
        
        function generarCanvas() {
            const w = imageData.width;
            const h = imageData.height;
            let js = `// Imagen generada con Image-to-Code\nconst canvas = document.createElement('canvas');\ncanvas.width = ${w};\ncanvas.height = ${h};\nconst ctx = canvas.getContext('2d');\nconst img = ctx.createImageData(${w}, ${h});\nconst data = [\n`;
            
            const pixels = [];
            for (let i = 0; i < imageData.data.length; i += 4) {
                pixels.push(`[${imageData.data[i]},${imageData.data[i+1]},${imageData.data[i+2]},${imageData.data[i+3]}]`);
            }
            js += '  ' + pixels.join(',\n  ') + '\n];\n';
            js += `data.forEach((p, i) => {\n  img.data[i*4] = p[0];\n  img.data[i*4+1] = p[1];\n  img.data[i*4+2] = p[2];\n  img.data[i*4+3] = p[3];\n});\nctx.putImageData(img, 0, 0);\ndocument.body.appendChild(canvas);`;
            generatedCode = js;
        }
        
        function generarASCII() {
            const w = imageData.width;
            const h = imageData.height;
            const chars = '@%#*+=-:. ';
            let ascii = `/* Imagen ASCII generada con Image-to-Code */\n<pre style="font-size:8px;line-height:8px;">\n`;
            
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const r = imageData.data[i];
                    const g = imageData.data[i+1];
                    const b = imageData.data[i+2];
                    const brightness = (r + g + b) / 3;
                    const charIndex = Math.floor((brightness / 255) * (chars.length - 1));
                    ascii += chars[charIndex];
                }
                ascii += '\n';
            }
            ascii += `</pre>`;
            generatedCode = ascii;
        }
        
        function cambiarTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            convertir();
        }
        
        function copiarCodigo() {
            navigator.clipboard.writeText(generatedCode);
            alert('Código copiado al portapapeles');
        }
    </script>
</body>
</html>
